packages:
  - "packages/*"
  - "apps/desktop"
  - "apps/site"

nodeLinker: hoisted
publicHoistPattern:
  - "*electron*"
  - "*node-pty*"
  - "*@vscode*"

overrides:
  nanoid: 3.3.18
  node-gyp: ^12.2.0
  # TODO: drop once electron-builder loosens its pinned plist 3.1.0 dependency;
  # 0.8.15 fixes GHSA-6gmq-8vp8-gcm6 within plist's declared ^0.8.8 range
  "@xmldom/xmldom": 0.8.15
  # TODO: drop once electron-builder (26.15.3, already latest) refreshes its
  # snapshot; app-builder-lib/builder-util declare js-yaml ^4.1.0
  js-yaml: 4.3.2
  # TODO: drop once @modelcontextprotocol/sdk (1.32.1, already latest) refreshes
  # its snapshot; it declares hono ^4.11.4
  hono: 4.13.16
  # TODO: drop once wait-on (9.1.0, already latest) refreshes its snapshot;
  # it declares joi ^18.2.3
  joi: 18.3.1
  # TODO: drop once Streamdown and Mermaid support KaTeX 0.18.x;
  # 0.18.2 fixes GHSA-238p-pmpm-9mq7 across their shared rendering dependency graph.
  katex: 0.18.2
  # TODO: drop once oxfmt loosens its pinned tinypool 2.1.0 dependency;
  # 2.1.2 fixes the prototype-pollution worker option gadgets.
  tinypool: 2.1.2
  # TODO: drop once concurrently loosens its pinned shell-quote 1.9.0 dependency;
  # 1.11.0 rejects line terminators after comment tokens instead of emitting shell input.
  shell-quote: 1.11.0
  # TODO: drop once electron-builder and @electron/universal support Minimatch 11;
  # 11.0.1 fixes globparts amplification on their vulnerable 9.x and 10.x branches.
  "app-builder-lib>minimatch": 11.0.1
  "@electron/universal>minimatch": 11.0.1

peerDependencyRules:
  # i18next / react-i18next declare peer typescript "^5 || ^6" for their own
  # type-testing matrix only; their runtime and d.ts work on TS 7 (all our
  # tsconfigs use skipLibCheck). Acknowledge the intentional mismatch.
  allowedVersions:
    typescript: "7"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
