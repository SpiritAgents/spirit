packages:
  - "packages/*"
  - "apps/desktop"
  - "apps/site"

nodeLinker: hoisted
publicHoistPattern:
  - "*electron*"
  - "*node-pty*"
  - "*@vscode*"

overrides:
  nanoid: 3.3.18
  node-gyp: ^12.2.0
  # TODO: drop once electron-builder loosens its pinned plist 3.1.0 dependency;
  # 0.8.15 fixes GHSA-6gmq-8vp8-gcm6 within plist's declared ^0.8.8 range
  "@xmldom/xmldom": 0.8.15

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  sharp: true
