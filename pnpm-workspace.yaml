packages:
  - "packages/*"
  - "apps/desktop"
  - "apps/site"

nodeLinker: hoisted
publicHoistPattern:
  - "*electron*"
  - "*node-pty*"
  - "*@vscode*"

overrides:
  nanoid: 3.3.18
  node-gyp: ^12.2.0
  # TODO: drop once electron-builder loosens its pinned plist 3.1.0 dependency;
  # 0.8.15 fixes GHSA-6gmq-8vp8-gcm6 within plist's declared ^0.8.8 range
  "@xmldom/xmldom": 0.8.15
  # TODO: drop once electron-builder (26.15.3, already latest) refreshes its
  # snapshot; app-builder-lib/builder-util declare js-yaml ^4.1.0
  js-yaml: 4.3.2
  # TODO: drop once @modelcontextprotocol/sdk (1.30.0, already latest) refreshes
  # its snapshot; it declares hono ^4.11.4
  hono: 4.13.7
  # TODO: drop once wait-on (9.1.0, already latest) refreshes its snapshot;
  # it declares joi ^18.2.3
  joi: 18.2.8

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
