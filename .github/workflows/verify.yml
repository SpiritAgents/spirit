# Build-check all packages and apps on every branch push.
name: Verify

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build packages and apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check invisible Unicode
        run: python3 scripts/check-invisible-unicode.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages, Desktop, and site
        run: pnpm turbo run build

      - name: Test TypeScript packages and Desktop (Vitest)
        run: pnpm test

      - name: Typecheck TypeScript packages (includes test files)
        run: pnpm turbo run typecheck

      - name: Lint TypeScript (Oxlint)
        run: pnpm exec oxlint --deny-warnings packages apps/desktop apps/site

      - name: Check TypeScript formatting (Oxfmt)
        run: pnpm exec oxfmt --check packages apps/desktop apps/site

      - name: Build CLI
        run: cargo build -p spirit

      - name: Check CLI formatting
        run: cargo fmt -p spirit --check

      - name: Clippy CLI (deny warnings)
        run: cargo clippy --all-targets -p spirit -- -D warnings

      - name: Test CLI
        run: cargo test -p spirit
