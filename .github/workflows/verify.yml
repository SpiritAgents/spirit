# Build-check all packages and apps on every branch push.
name: Verify

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript-build:
    name: TypeScript Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check invisible Unicode
        run: python3 scripts/check-invisible-unicode.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-v1-

      - name: Build TypeScript packages, Desktop, and site
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm turbo run build --summarize
          else
            pnpm turbo run build
          fi

      - name: Run boundary checks and non-Vitest package tests
        run: pnpm run test:checks

      - name: Typecheck TypeScript packages (includes test files)
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm turbo run typecheck --summarize
          else
            pnpm turbo run typecheck
          fi

      - name: Lint TypeScript (Oxlint)
        run: pnpm exec oxlint --deny-warnings packages apps/desktop apps/site

      - name: Check TypeScript formatting (Oxfmt)
        run: pnpm exec oxfmt --check packages apps/desktop apps/site

      - name: Prune Turbo cache
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/prune-turbo-cache.mjs

      - name: Save Turbo cache
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-v1-${{ github.sha }}

  typescript-test-packages:
    name: TypeScript Tests (Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-v1-

      - name: Build workspace packages and Desktop
        run: pnpm turbo run build --filter=!@spiritagent/site

      - name: Test packages and Desktop (Vitest)
        run: pnpm exec vitest run --project='!@spiritagent/web'

  typescript-test-web:
    name: TypeScript Tests (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-v1-

      - name: Build workspace packages and Desktop
        run: pnpm turbo run build --filter=!@spiritagent/site

      - name: Test Web renderer and host (Vitest)
        run: pnpm exec vitest run --project=@spiritagent/web

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clippy CLI (deny warnings)
        run: cargo clippy --all-targets -p spirit -- -D warnings

  rust-build-test:
    name: Rust Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-v1-

      - name: Build Server and workspace dependencies
        run: pnpm turbo run build --filter=@spiritagent/server

      - name: Build CLI
        run: cargo build -p spirit

      - name: Check CLI formatting
        run: cargo fmt -p spirit --check

      - name: Test CLI
        run: cargo test -p spirit
