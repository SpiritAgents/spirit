# Manual release pipeline: build HEAD → prepare report → environment:release gate → stage npm
# packages → environment:release gate again (approve the staged packages on npmjs.com first) →
# publish R2 objects, the GitHub Release, and the tag X.Y.Z (or X.Y.Z-alpha.N / -beta.N / -rc.N).
# Configure GitHub Environment "release" with Required reviewers (and Cloudflare secrets) before publishing.
# Configure GitHub Environment "signing" WITHOUT reviewers (build jobs must not sit behind the approval gate):
#   APPLE_CSC_LINK / APPLE_CSC_PASSWORD      base64 Developer ID .p12 and its password
#   APPLE_TEAM_ID                            expected TeamIdentifier, asserted by the signature checks
#   APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER  App Store Connect key used by the notarize job
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z or X.Y.Z-alpha.N / -beta.N / -rc.N, for example 1.0.0-beta.1)"
        required: true
        type: string
permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org/

      - name: Verify versions
        run: pnpm run release:verify-version -- --version "$RELEASE_VERSION"

  cli:
    name: CLI ${{ matrix.package_target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Only the macOS legs sign, so only they get the signing secrets; an empty name means no
    # environment at all, which also keeps the Windows and Linux legs out of the deployment log.
    environment: ${{ matrix.apple && 'signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package_target: windows-x64
            builder: cargo
          - os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            package_target: windows-arm64
            builder: cargo
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            package_target: linux-x64
            builder: cargo
          - os: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            package_target: linux-arm64
            builder: cross
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            package_target: darwin-x64
            builder: cargo
            apple: true
          - os: macos-14
            rust_target: aarch64-apple-darwin
            package_target: darwin-arm64
            builder: cargo
            apple: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript runtime
        run: pnpm turbo run build --filter=@spiritagent/agent-core --filter=@spiritagent/host-internal

      - name: Setup Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build CLI
        if: matrix.builder == 'cargo'
        run: cargo build -p spirit --release --target ${{ matrix.rust_target }}

      - name: Build CLI with cross
        if: matrix.builder == 'cross'
        run: cross build -p spirit --release --target ${{ matrix.rust_target }}

      # Bundle CLI signs the embedded Mach-O binaries when it sees these two vars, so the identity
      # has to be in place before bundling rather than after the archive exists.
      - name: Import signing certificate
        if: matrix.apple
        env:
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_PASSWORD: ${{ secrets.APPLE_CSC_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/spirit-signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CSC_PASSWORD" -T /usr/bin/codesign -x
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # codesign resolves the certificate chain through the search list, not through --keychain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::The imported keychain holds no Developer ID Application identity."
            exit 1
          fi
          echo "SPIRIT_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SPIRIT_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Bundle CLI
        run: pnpm run release:cli:bundle -- --target ${{ matrix.rust_target }} --version "$RELEASE_VERSION"
        shell: bash

      # The bundler only warns when no identity is configured, so this is the gate that turns an
      # unsigned macOS archive into a failed job. It inspects the archive, not the staging directory.
      - name: Verify CLI signature
        if: matrix.apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="dist/release/Spirit-CLI-$RELEASE_VERSION-${{ matrix.package_target }}.tar.gz"
          workdir="$RUNNER_TEMP/cli-verify"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          tar -xzf "$archive" -C "$workdir"
          root="$workdir/Spirit-CLI-$RELEASE_VERSION-${{ matrix.package_target }}"
          for relative in bin/spirit node/bin/node; do
            binary="$root/$relative"
            if [ ! -f "$binary" ]; then
              echo "::error::$relative is missing from $archive."
              exit 1
            fi
            codesign --verify --strict "$binary"
            details="$(codesign --display --verbose=4 "$binary" 2>&1)"
            if ! grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" <<<"$details"; then
              echo "::error::$relative is not signed by team $APPLE_TEAM_ID."
              exit 1
            fi
            if ! grep -qE '^CodeDirectory .*flags=.*runtime' <<<"$details"; then
              echo "::error::$relative is missing the Hardened Runtime flag."
              exit 1
            fi
            echo "verified $relative"
          done
          # A valid signature does not prove the binary still runs: re-signing stock Node with our
          # own entitlements is the one change here that can kill V8 at startup.
          "$root/node/bin/node" --version
          "$root/bin/spirit" --version

      - name: Remove signing keychain
        if: always() && matrix.apple
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/spirit-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.package_target }}
          path: dist/release/Spirit-CLI-*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.package_target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Only the macOS legs sign, so only they get the signing secrets; an empty name means no
    # environment at all, which also keeps the Windows and Linux legs out of the deployment log.
    environment: ${{ matrix.platform == 'mac' && 'signing' || '' }}
    env:
      npm_config_registry: https://registry.npmjs.org/
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            package_target: windows-x64
          - os: windows-latest
            platform: win
            arch: arm64
            package_target: windows-arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            package_target: linux-x64
          - os: ubuntu-24.04
            platform: linux
            arch: arm64
            package_target: linux-arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            package_target: darwin-x64
          - os: macos-14
            platform: mac
            arch: arm64
            package_target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop
        run: pnpm --filter @spiritagent/desktop run build

      - name: Generate brand assets
        working-directory: apps/desktop
        run: pnpm run gen:brand-assets

      # Signing env vars must stay off the Windows and Linux legs: electron-builder treats an empty
      # CSC_LINK as a real value, so the two package steps are mutually exclusive rather than merged.
      - name: Package Desktop (signed)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_PASSWORD }}
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Package Desktop
        if: matrix.platform != 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      # electron-builder only warns when it silently skips signing, so this is the gate that turns
      # an unsigned macOS build into a failed job. Notarization is asserted by the notarize job.
      - name: Verify Desktop signature
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under apps/desktop/release."
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$details"
          if ! grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" <<<"$details"; then
            echo "::error::Signed by an unexpected team; expected TeamIdentifier=$APPLE_TEAM_ID."
            exit 1
          fi
          if ! grep -qE '^CodeDirectory .*flags=.*runtime' <<<"$details"; then
            echo "::error::Hardened Runtime flag is missing from the signature."
            exit 1
          fi

      # macOS output is not releasable yet, so it is staged under a name the release jobs ignore.
      - name: Upload Desktop artifact (awaiting notarization)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: unnotarized-${{ matrix.package_target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

      - name: Upload Desktop artifact
        if: matrix.platform != 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.package_target }}
          # electron-builder leaves *-unpacked dirs when packaging Linux; exclude them.
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error

  # Notarization is its own job so a failed Apple round trip can be re-run without rebuilding and
  # re-signing. Each leg stays on its target architecture because the final spctl assessment is
  # only meaningful on a machine that could actually launch the app.
  notarize:
    name: Notarize Desktop ${{ matrix.package_target }}
    needs: desktop
    runs-on: ${{ matrix.os }}
    environment: signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            package_target: darwin-x64
          - os: macos-14
            package_target: darwin-arm64
    steps:
      - name: Download signed Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: unnotarized-${{ matrix.package_target }}
          path: staging

      # notarytool takes --key as a file path, so the base64 secret has to be materialized on disk.
      - name: Write notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::Environment secret APPLE_API_KEY_P8 is missing; the macOS build cannot be notarized."
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # `notarytool submit --wait` hides both progress and transient failures inside one silent
      # process, and a dropped connection there discards a completed upload. Uploading once and
      # polling here keeps the submission id, so a network blip costs one retry instead of the run.
      - name: Notarize disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          dmg="$(find staging -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in the staged artifact."
            exit 1
          fi
          echo "Submitting $dmg ($(du -h "$dmg" | cut -f1))"
          submission="$(xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --no-wait --output-format json)"
          id="$(jq -r '.id' <<<"$submission")"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::notarytool did not return a submission id: $submission"
            exit 1
          fi
          echo "submission id: $id"
          echo "SPIRIT_NOTARIZATION_ID=$id" >> "$GITHUB_ENV"

          status=""
          for attempt in $(seq 1 240); do
            if info="$(xcrun notarytool info "$id" \
                --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                --output-format json 2>&1)"; then
              status="$(jq -r '.status // "unknown"' <<<"$info")"
              echo "[$attempt] $(date -u +%H:%M:%S) status=$status"
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  echo "::error::Apple rejected the submission."
                  xcrun notarytool log "$id" \
                    --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                  exit 1
                  ;;
              esac
            else
              echo "[$attempt] $(date -u +%H:%M:%S) status query failed, retrying"
            fi
            sleep 30
          done
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization did not reach Accepted within the polling window (last status: ${status:-none})."
            exit 1
          fi

      # Stapling embeds the ticket so Gatekeeper clears the app without contacting Apple. The zip
      # holds a second copy of the same .app, which needs its own stapled ticket before rezipping.
      - name: Staple tickets
        run: |
          set -euo pipefail
          dmg="$(find staging -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find staging -maxdepth 1 -name '*.zip' -print -quit)"
          xcrun stapler staple "$dmg"

          workdir="$RUNNER_TEMP/zip-restaple"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          ditto -x -k "$zip" "$workdir"
          app="$(find "$workdir" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app found inside $zip."
            exit 1
          fi
          xcrun stapler staple "$app"
          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          echo "SPIRIT_STAPLED_APP=$app" >> "$GITHUB_ENV"

      - name: Verify notarized artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(find staging -maxdepth 1 -name '*.dmg' -print -quit)"
          app="$SPIRIT_STAPLED_APP"
          xcrun stapler validate "$dmg"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" <<<"$details"; then
            echo "::error::Signed by an unexpected team; expected TeamIdentifier=$APPLE_TEAM_ID."
            exit 1
          fi
          # The only check that answers "will this launch on a clean Mac".
          spctl --assess --verbose=4 --type exec "$app"

      - name: Remove notarization API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.package_target }}
          path: |
            staging/*.dmg
            staging/*.zip
          if-no-files-found: error

  # prepare builds the English approval summary (changelog + per-channel asset tables).
  prepare:
    name: Prepare approval report
    needs:
      - cli
      - desktop
      - notarize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Two scoped downloads rather than one bulk fetch: the unnotarized-* staging artifacts carry
      # the same filenames as their notarized replacements and must not reach the release.
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Prepare approval report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          pnpm run release:prepare-approval-report -- \
            --input release-assets \
            --output-dir release-assets/approval \
            --version "$RELEASE_VERSION" \
            --sha "${{ github.sha }}"

      - name: Write job summary
        run: cat release-assets/approval/approval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/
          if-no-files-found: error

  # Phase-1 approval gate: Environment "release" (Required reviewers). After approval this job
  # only STAGES the npm packages; the publish job below sits behind the same environment again,
  # and its Waiting notification is the "staging done" signal — approve the staged packages on
  # npmjs.com (2FA) before approving that second deployment.
  # npm Trusted Publisher on each package must use Environment name "release" (match this job)
  # and allow "npm stage publish" only — direct "npm publish" is rejected there.
  stage:
    name: Stage npm packages
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          # No registry-url: Trusted Publishing uses OIDC. setup-node registry-url injects
          # _authToken=${NODE_AUTH_TOKEN} (often GitHub token), which skips OIDC and breaks staging.
          cache: pnpm

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-assets

      - name: Show approval report
        run: |
          echo "Review the English approval report in the prepare job summary before approving this environment deployment."
          echo
          cat release-assets/approval/approval-report.md >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/approval/approval-report.md

      - name: Install dependencies for npm stage
        run: pnpm install --frozen-lockfile

      - name: Build packages for npm stage
        run: pnpm turbo run build --filter=@spiritagent/agent-core --filter=@spiritagent/host-internal --filter=@spiritagent/extension-toolkit --filter=@spiritagent/create-extension --filter=@spiritagent/acp-server

      - name: Stage npm packages
        run: |
          set -euo pipefail
          # Trusted Publishing (OIDC): do not set NODE_AUTH_TOKEN (empty still blocks OIDC).
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" || true
          fi
          # This job uses GitHub Environment "release". On npmjs.com → Trusted Publisher,
          # each package MUST set Environment name to exactly "release" (not blank), or OIDC
          # claim matching fails (often with a misleading error).
          # Workflow filename must be release.yml. Provenance needs matching repository.url.
          mkdir -p npm-publish-logs
          : > staged-packages.md
          : > approve-commands.txt
          # Dependency order: agent-core → host-internal → extension-toolkit → create-extension; acp-server stays last
          stage_one() {
            local dir="$1"
            local name version parsed tag tarball tarball_path log
            name="$(node -p "require('./${dir}/package.json').name")"
            # The extension packages version independently of the product release, so the
            # already-published check reads each package's own version rather than RELEASE_VERSION.
            version="$(node -p "require('./${dir}/package.json').version")"
            if pnpm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Already on npm: ${name}@${version}; skipping."
              echo "- ${name}@${version} (already live — no action needed)" >> staged-packages.md
              return 0
            fi
            # A prerelease must carry an explicit dist-tag (npm errors otherwise), and the tag
            # follows the package's own channel rather than the product release channel.
            parsed="$(node scripts/release/version.mjs --version "$version")"
            tag="$(node -e 'console.log(JSON.parse(process.argv[1]).npmTag)' "$parsed")"
            echo "Packing ${name}@${version} from ${dir} (tag: ${tag})"
            # Stage a local tarball so pack failures are visible before OIDC upload.
            tarball="$(pnpm --dir "./${dir}" pack --pack-destination "../../npm-publish-logs" | tail -1)"
            tarball_path="./npm-publish-logs/$(basename "$tarball")"
            echo "Staging tarball ${tarball_path}"
            tag_args=()
            if [ "$tag" != "latest" ]; then
              tag_args+=(--tag "$tag")
            fi
            log="npm-publish-logs/${name//\//_}.log"
            if pnpm stage publish "${tarball_path}" --access public --no-git-checks --loglevel verbose "${tag_args[@]}" 2>&1 | tee "$log"; then
              echo "- ${name}@${version}" >> staged-packages.md
              echo "pnpm stage approve ${name}@${version}" >> approve-commands.txt
              return 0
            fi
            # Re-runs converge: a version staged by an earlier run occupies the version slot and
            # cannot be re-staged (E409 "Cannot stage previously published version"). CI cannot
            # reject it ("npm stage reject" needs interactive 2FA), so tolerate exactly this
            # conflict and leave the staged version for the maintainer's approval pass.
            if grep -qE 'E409|Cannot stage previously published version' "$log"; then
              echo "::warning::${name}@${version} is already staged; leaving it for approval."
              echo "- ${name}@${version} (already staged)" >> staged-packages.md
              echo "pnpm stage approve ${name}@${version}" >> approve-commands.txt
              return 0
            fi
            echo "::error::pnpm stage publish failed for ${name}. Check Trusted Publisher: org/repo/workflow=release.yml/environment=release, allowed action = npm stage publish"
            echo '--- last 80 lines of stage log ---' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$log" >> "$GITHUB_STEP_SUMMARY" || true
            return 1
          }
          stage_one packages/agent-core
          stage_one packages/host-internal
          stage_one packages/extension-toolkit
          stage_one packages/create-extension
          stage_one packages/acp-server
          # npm sends no notification when a package is staged; the publish job's Waiting
          # deployment mails the reviewers instead, and this summary is what they see when
          # they follow it. Approve on npmjs.com (2FA) before approving the publish job.
          {
            echo '## Staged on npm — approve before the publish job'
            echo
            cat staged-packages.md
            echo
            echo 'npmjs.com → profile menu → **Staged Packages**, or per package (2FA):'
            echo
            echo '```bash'
            cat approve-commands.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase-2 approval gate: Environment "release" again (Required reviewers + Cloudflare secrets).
  # GitHub mails the reviewers when this job enters Waiting — that is the "staging done" signal.
  # Approve the staged packages on npmjs.com BEFORE approving here: the first real step verifies
  # every package is live and fails fast otherwise (re-running the failed job re-asks approval).
  publish:
    name: Publish public channels
    needs: stage
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Resolve release channel
        run: |
          set -euo pipefail
          parsed="$(node scripts/release/version.mjs --version "$RELEASE_VERSION")"
          echo "Resolved release version: $parsed"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            console.log(`RELEASE_CHANNEL=${parsed.channel}`);
            console.log(`RELEASE_PRERELEASE=${parsed.prerelease}`);
          ' "$parsed" >> "$GITHUB_ENV"

      # Staged packages are invisible to `pnpm view` until a maintainer approves them on
      # npmjs.com, so this is the proof that the 2FA approval pass already happened.
      - name: Verify npm packages are live
        run: |
          set -euo pipefail
          missing=0
          check_live() {
            local dir="$1"
            local name version
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if pnpm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "live: ${name}@${version}"
            else
              echo "::error::${name}@${version} is not live on npm. Approve the staged packages first (see the stage job summary)."
              missing=1
            fi
          }
          check_live packages/agent-core
          check_live packages/host-internal
          check_live packages/extension-toolkit
          check_live packages/create-extension
          check_live packages/acp-server
          [ "$missing" -eq 0 ]

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-assets

      - name: Show approval report
        run: |
          echo "Review the English approval report in the prepare job summary before approving this environment deployment."
          echo
          cat release-assets/approval/approval-report.md >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/approval/approval-report.md

      # Self-hosted first: R2 failures must not leave the GitHub Release already public.
      # Keep R2 credentials on this step only; this job runs no dependency install, so
      # postinstall scripts never see them.
      - name: Publish self-hosted downloads
        env:
          SPIRIT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SPIRIT_CLOUDFLARE_ACCOUNT_ID }}
          SPIRIT_CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.SPIRIT_CLOUDFLARE_ACCESS_KEY_ID }}
          SPIRIT_CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.SPIRIT_CLOUDFLARE_SECRET_ACCESS_KEY }}
          SPIRIT_CLOUDFLARE_BUCKET_NAME: ${{ secrets.SPIRIT_CLOUDFLARE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$SPIRIT_CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SPIRIT_CLOUDFLARE_ACCESS_KEY_ID" ] || [ -z "$SPIRIT_CLOUDFLARE_SECRET_ACCESS_KEY" ] || [ -z "$SPIRIT_CLOUDFLARE_BUCKET_NAME" ]; then
            echo "::error::Environment secrets SPIRIT_CLOUDFLARE_ACCOUNT_ID, SPIRIT_CLOUDFLARE_ACCESS_KEY_ID, SPIRIT_CLOUDFLARE_SECRET_ACCESS_KEY, and SPIRIT_CLOUDFLARE_BUCKET_NAME are required (R2 S3 API credentials)."
            exit 1
          fi
          pnpm run release:publish-selfhosted -- \
            --input release-assets \
            --version "$RELEASE_VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Allow re-runs after partial success (e.g. R2 OK, GitHub Release failed).
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION already exists; skipping create."
          else
            mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f -print0)
            if [ "${#assets[@]}" -eq 0 ]; then
              echo "No release assets found under release-assets" >&2
              exit 1
            fi
            notes_file="release-assets/approval/release-notes.md"
            if [ ! -f "$notes_file" ]; then
              echo "Missing approval release notes: $notes_file" >&2
              exit 1
            fi
            # Tag name is X.Y.Z or X.Y.Z-alpha.N / -beta.N / -rc.N (no "v" prefix).
            extra_args=()
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$RELEASE_VERSION" "${assets[@]}" \
              --title "$RELEASE_VERSION" \
              --target "${{ github.sha }}" \
              --notes-file "$notes_file" \
              "${extra_args[@]}"
          fi

      # After publish finishes, ensure the archival tag (X.Y.Z or prerelease) points at the built SHA.
      - name: Ensure tag at release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_VERSION"
          EXPECTED_SHA="${{ github.sha }}"

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            ACTUAL_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              # Recovery re-run after a prior partial publish may land on a newer workflow SHA.
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "Tag ${TAG} already at ${ACTUAL_SHA} and GitHub Release exists; leaving tag unchanged (run SHA ${EXPECTED_SHA})."
                exit 0
              fi
              echo "::error::Tag ${TAG} points to ${ACTUAL_SHA}, expected ${EXPECTED_SHA}"
              exit 1
            fi
            echo "Tag ${TAG} already points at ${EXPECTED_SHA}"
          else
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed tag ${TAG} at ${EXPECTED_SHA}"
          fi
