tui.mcp.usage: "使用法:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\n補足:\n- `/mcp add` は下部フォームを開き、保存先（ユーザー / ワークスペース `.spirit`）や STDIO / HTTP サーバーを設定できます。Enter で保存、Esc でキャンセル。\n- MCP プロンプトは一級スラッシュコマンドとして公開されます（例: `/github_issue_to_fix_workflow`）。末尾が有効な JSON object の場合はプロンプト引数として直接使用され、それ以外のテキストは追加のユーザーメッセージとして LLM に送信されます。\n- 末尾を省略し、プロンプトに引数が定義されている場合は引数フォームが自動で開きます。フォームの最後の欄に補足を入力できます。\n- `/mcp tool call`、`/mcp resource attach`、`/mcp resource clear` はデバッグ用として残っていますが、主な操作経路ではありません。"
