tui.tui.help: "- /tui を引数なしで実行すると、TUI レイアウト選択メニューが開きます。"
tui.loop.help: "- /loop でこのセッションのループ状態を切り替えます。/loop on、/loop off、/loop status も使用できます。"
tui.help.available_commands: "利用可能なコマンド:"
tui.help.notes_header: "説明:"
tui.help.skill_usage: "- /<skill-name> [補足説明]"
tui.help.log_variants: "- /log（または /log export、/log session export）"
tui.help.continue: "- /continue は明示的に中断された前回の assistant 応答を再開します。"
tui.help.subagents: "- /subagent で現在のセッションの SubAgent 一覧を開きます。Enter で読み取り専用のサブセッションビューに入り、Esc でメインセッションに戻ります。"
tui.help.image_pick: "- /image pick で現在のディレクトリの画像ピッカーを開きます。"
tui.help.image_queue: "- /image は prompt を付けない場合、画像を送信待ちキューに追加します。"
tui.help.file_reference: "- @<ファイル名> を入力するとワークスペースのファイル参照サジェストが開き、Enter で選択したファイルを @パス + スペースの形式で入力欄に書き戻します。"
tui.help.mcp_add: "- /mcp add で下部フォームを開き、server 名、保存場所（ユーザー / ワークスペース `.spirit`）、タイプ、コマンドまたは URL を入力します（Enter で保存、Esc でキャンセル）。"
tui.help.hooks_add: "- /hook add で下部フォームを開き、Agent Hook を追加します（Enter で保存、Esc でキャンセル）。"
tui.help.model_add: "- /model add で下部フォームを開きます：プロバイダーと追加方法を選び、エンドポイントと API Key を入力します。送信後に上流の /models をリクエストします（プリセットは全 id を一括インポート、カスタムは単件も可能）。/model add <name> <api_base> <api_key> の1行形式も使えます。成功すると現在のモデルが切り替わります。"
tui.help.mcp_prompt_alias: "- MCP prompt は /github_issue_to_fix_workflow のような一級 slash コマンドとして公開されます。末尾が有効な JSON object の場合はそのまま prompt 引数として使われ、それ以外のテキストは追加のユーザーメッセージとして LLM に送られます。"
tui.help.mcp_prompt_form: "- 末尾を省略し、prompt に引数が定義されている場合は引数フォームが自動で開きます。フォームの最後の欄には追加の補足を入力できます。"
tui.help.rules: "- /rule でスクロール可能なルール有効化リストを開きます。Enter で現在のルールを切り替え、Esc で保存して閉じ、マウスホイールで長い内容をスクロールできます。"
tui.help.skills: "- /skill でスクロール可能なスキル有効化リストを開きます。Enter で現在のスキルを切り替え、Esc で保存して閉じ、マウスホイールで長い内容をスクロールできます。"
tui.help.extensions: "- /extension を引数なしで実行するとインストール済み拡張パネルを開きます（Enter で有効状態を切り替え、Esc で保存）。/extension list はインストール済み拡張を出力し、/extension import <zip> は ZIP をインポート、/extension remove <id> は拡張を削除します。"
tui.help.marketplace: "- /marketplace を引数なしで実行するとローカル内蔵カタログを開きます（Enter でインストールまたはアンインストール、Esc で閉じる）。/marketplace list はカタログを表示し、/marketplace install <id> は同梱の内蔵拡張をインストール、/marketplace remove <id> はアンインストールします。"
tui.help.skill_alias: "- 有効な skill は /llm-debug のような一級 slash コマンドとして直接公開されます。末尾のテキストはこのターンの追加補足として使われ、skill 本文は独立した system prompt 状態として注入され、モデルが自分でファイルを読んだかのように振る舞いません。"
tui.help.mcp_server_optional: "- /mcp tools、/mcp resources、/mcp prompts は server が1つだけの場合 server を省略できます。"
tui.help.log: "- /log は既定で現在の CLI ログを開きます。/log export は現在の CLI ログのスナップショットをエクスポートし、/log session export は LLM セッション全文とリクエスト履歴をエクスポートします。"
tui.help.language: "- /language を引数なしで実行すると言語選択メニューを開きます。"
tui.help.approval: "- /approval を引数なしで実行すると承認レベル選択メニューを開きます。"
tui.help.networks: "- /network を引数なしで実行すると LLM HTTP バージョン選択メニューを開きます。"
tui.help.mouse: "- マウスは既定で有効です：ホイールで履歴をスクロール。Conversation 内で選択範囲をドラッグし、Ctrl+Shift+C または右クリックでコピーすると反転選択が解除されます。"
tui.help.ctrl_o: "- Ctrl+O で補助的な詳細の表示/非表示を切り替えます：思考内容、圧縮サマリー、ツール結果の詳細を含みます。完了した応答の補助詳細も保持され、失敗・承認待ちのツールは展開されたままです。"
tui.help.api_key_priority: "API Key の優先順位: SPIRIT_API_KEY > モデル固有の keyring > グローバル keyring。"
tui.plan.start_implementing_only_plan: "このコマンドは Plan モードでのみ使用できます。Tab キーを押して Plan に切り替えてから再試行してください。"
