tui.help.continue: "- /continue 會繼續上一輪被明確中止的 assistant 回覆。"
tui.help.subagents: "- /subagent 打開當前會話裡的 SubAgent 列表；Enter 可進入唯讀子會話視圖，Esc 返回主會話。"
tui.help.image_pick: "- /image pick 打開當前目錄圖片選擇器。"
tui.help.image_queue: "- /image 不帶 prompt 時會把圖片加入待發送佇列。"
tui.help.file_reference: "- 輸入 @<檔名> 會打開工作區檔案引用建議，Enter 後會把選中檔案寫回輸入框，格式為 @路徑 加一個空格。"
tui.help.mcp_add: "- /mcp add 打開底部表單，用於填寫 server 名稱、保存位置（使用者 / 工作區 `.spirit`）、類型、命令或 URL（Enter 保存，Esc 取消）。"
tui.help.hooks_add: "- /hook add 打開底部表單，用於新增 Agent Hook（Enter 保存，Esc 取消）。"
tui.help.model_add: "- /model add 打開底部表單：選提供商與新增方式、填寫端點與 API Key；提交後將請求上游 /models（預設為批量匯入全部 id，自定義可選單條）；也可一行 /model add <name> <api_base> <api_key>；成功後會切換當前模型。"
tui.help.mcp_prompt_alias: "- MCP prompt 會以一級 slash 命令暴露，例如 /github_issue_to_fix_workflow；若尾部是合法 JSON object，會直接作為 prompt 參數，其他文字會作為附加使用者訊息發給 LLM。"
tui.help.mcp_prompt_form: "- 省略尾部且 prompt 定義了參數時，會自動打開參數表單；表單最後一欄可填寫附加說明。"
tui.help.rules: "- /rule 打開可滾動的規則啟用清單；Enter 切換當前規則，Esc 保存並關閉，滑鼠滾輪可瀏覽長內容。"
tui.help.skills: "- /skill 打開可滾動的技能啟用清單；Enter 切換當前技能，Esc 保存並關閉，滑鼠滾輪可瀏覽長內容。"
tui.help.extensions: "- /extension 不帶參數時會打開已安裝擴展面板（Enter 切換啟用狀態，Esc 儲存）。/extension list 會輸出當前已安裝擴展，/extension import <zip> 匯入 ZIP，/extension remove <id> 刪除擴展。"
tui.help.skill_alias: "- 已啟用的 skill 會直接作為一級 slash 命令暴露，例如 /llm-debug；尾部文字會作為本輪附加說明，skill 正文會作為獨立 system prompt 狀態注入，不會偽裝成模型自行讀檔案。"
tui.help.mcp_server_optional: "- /mcp tools、/mcp resources、/mcp prompts 在只有一個 server 時可省略 server。"
tui.help.log: "- /log 預設打開當前 CLI 日誌；/log export 匯出當前 CLI 日誌快照；/log session export 匯出 LLM 會話全文與請求軌跡。"
tui.help.language: "- /language 不帶參數時打開語言選擇選單。"
tui.help.approval: "- /approval 不帶參數時打開審批級別選擇選單。"
tui.help.networks: "- /network 不帶參數時打開 LLM HTTP 版本選擇選單。"
tui.help.mouse: "- 滑鼠預設開啟：滾輪瀏覽歷史；在 Conversation 內拖曳選區，Ctrl+Shift+C 或右鍵複製後會清除反色選區。"
tui.help.ctrl_o: "- Ctrl+O 切換輔助細節的顯示/隱藏：包括思考內容、壓縮摘要以及工具結果細節；已完成回覆的輔助細節也會保留，失敗與待確認工具保持展開。"
