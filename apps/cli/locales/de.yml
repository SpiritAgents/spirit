tui.mcp.usage: "Verwendung:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\nHinweise:\n- `/mcp add` öffnet das untere Formular, in dem Speicherort (Benutzer / Workspace `.spirit`) sowie STDIO- oder HTTP-Server eingetragen werden können; Enter speichert, Esc bricht ab.\n- MCP-Prompts werden als Slash-Befehle erster Ebene bereitgestellt, z. B. `/github_issue_to_fix_workflow`. Ist der nachfolgende Text ein gültiges JSON-Objekt, wird er direkt als Prompt-Argumente verwendet; anderer Text wird dem LLM als zusätzliche Benutzernachricht gesendet.\n- Wird der Text weggelassen und das Prompt definiert Argumente, öffnet sich automatisch ein Argumentformular; das letzte Feld akzeptiert eine zusätzliche Notiz.\n- `/mcp tool call`, `/mcp resource attach` und `/mcp resource clear` bleiben als Debug-Einstiegspunkte erhalten, sind aber nicht der Hauptinteraktionsweg."
