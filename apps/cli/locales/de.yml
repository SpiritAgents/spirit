tui.help.skill_usage: "- /<skill-name> [Notizen]"
tui.help.log_variants: "- /log (oder /log export, /log session export)"
tui.help.continue: "- /continue setzt die zuvor explizit abgebrochene Assistant-Antwort fort."
tui.help.subagents: "- /subagent öffnet die SubAgent-Liste der aktuellen Sitzung; Enter öffnet eine schreibgeschützte Unteransicht, Esc kehrt zur Hauptsitzung zurück."
tui.help.image_pick: "- /image pick öffnet die Bildauswahl für das aktuelle Verzeichnis."
tui.help.image_queue: "- /image ohne Prompt fügt das Bild der Sendewarteschlange hinzu."
tui.help.file_reference: "- Die Eingabe von @<Dateiname> öffnet Dateireferenz-Vorschläge für den Workspace; Enter schreibt die ausgewählte Datei als @Pfad gefolgt von einem Leerzeichen zurück in das Eingabefeld."
tui.help.mcp_add: "- /mcp add öffnet das untere Formular für Servername, Speicherort (Benutzer / Workspace `.spirit`), Typ sowie Befehl oder URL (Enter speichert, Esc bricht ab)."
tui.help.hooks_add: "- /hook add öffnet das untere Formular zum Hinzufügen eines Agent Hooks (Enter speichert, Esc bricht ab)."
tui.help.model_add: "- /model add öffnet das untere Formular: Anbieter und Hinzufügemodus wählen, Endpunkt und API Key eintragen; nach dem Absenden wird das Upstream-/models angefragt (Presets importieren alle IDs gesammelt, bei Custom ist ein einzelner Eintrag möglich); alternativ einzeilig: /model add <name> <api_base> <api_key>; bei Erfolg wird das aktive Modell gewechselt."
tui.help.mcp_prompt_alias: "- MCP-Prompts werden als Slash-Befehle erster Ebene bereitgestellt, z. B. /github_issue_to_fix_workflow; ist der angehängte Text ein gültiges JSON-Objekt, wird er direkt als Prompt-Argumente verwendet, anderer Text wird als zusätzliche Benutzernachricht an das LLM gesendet."
tui.help.mcp_prompt_form: "- Wird der angehängte Text weggelassen und der Prompt definiert Argumente, öffnet sich automatisch ein Argumentformular; das letzte Feld des Formulars nimmt eine zusätzliche Notiz entgegen."
tui.help.rules: "- /rule öffnet eine scrollbare Liste zur Regelaktivierung; Enter schaltet die aktuelle Regel um, Esc speichert und schließt, das Mausrad scrollt lange Inhalte."
tui.help.skills: "- /skill öffnet eine scrollbare Liste zur Skill-Aktivierung; Enter schaltet den aktuellen Skill um, Esc speichert und schließt, das Mausrad scrollt lange Inhalte."
tui.help.extensions: "- /extension ohne Argumente öffnet das Panel installierter Erweiterungen (Enter schaltet den Aktivierungsstatus um, Esc speichert). /extension list gibt die installierten Erweiterungen aus, /extension import <zip> importiert eine ZIP-Datei, /extension remove <id> entfernt eine Erweiterung."
tui.help.marketplace: "- /marketplace ohne Argumente öffnet den lokalen integrierten Katalog (Enter installiert oder deinstalliert, Esc schließt). /marketplace list gibt den Katalog aus, /marketplace install <id> installiert eine gebündelte integrierte Erweiterung, /marketplace remove <id> deinstalliert."
tui.help.skill_alias: "- Aktivierte Skills werden direkt als Slash-Befehle erster Ebene bereitgestellt, z. B. /llm-debug; angehängter Text dient als zusätzliche Notiz für diese Runde, und der Skill-Text wird als separater System-Prompt-Status injiziert, statt so zu tun, als würde das Modell selbst Dateien lesen."
tui.help.mcp_server_optional: "- Bei /mcp tools, /mcp resources und /mcp prompts kann der Server weggelassen werden, wenn nur ein Server vorhanden ist."
tui.help.log: "- /log öffnet standardmäßig das aktuelle CLI-Log; /log export exportiert einen Schnappschuss des aktuellen CLI-Logs; /log session export exportiert den vollständigen LLM-Sitzungsverlauf mit Anfragen."
tui.help.language: "- /language ohne Argumente öffnet das Sprachauswahlmenü."
tui.help.approval: "- /approval ohne Argumente öffnet das Menü zur Auswahl der Genehmigungsstufe."
tui.help.networks: "- /network ohne Argumente öffnet das Menü zur Auswahl der LLM-HTTP-Version."
tui.help.mouse: "- Die Maus ist standardmäßig aktiviert: das Mausrad scrollt durch den Verlauf; Ziehen einer Auswahl in der Conversation, Ctrl+Shift+C oder Rechtsklick-Kopieren löscht die hervorgehobene Auswahl."
tui.help.ctrl_o: "- Ctrl+O schaltet zusätzliche Details ein/aus: Denkinhalte, Kompaktzusammenfassungen und Tool-Ergebnisdetails; zusätzliche Details abgeschlossener Antworten bleiben erhalten, fehlgeschlagene und bestätigungsoffene Tools bleiben aufgeklappt."
