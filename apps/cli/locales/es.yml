tui.help.hooks_add: "- /hook add abre el formulario inferior para añadir un Agent Hook (Enter guarda, Esc cancela)."
tui.help.model_add: "- /model add abre el formulario inferior: elige proveedor y modo de alta, rellena el endpoint y la API Key; al enviar se solicita el /models upstream (los presets importan todos los id en lote, el personalizado permite una sola entrada); también en una línea: /model add <name> <api_base> <api_key>; si tiene éxito, cambia el modelo activo."
tui.help.mcp_prompt_alias: "- Los prompts MCP se exponen como comandos slash de primer nivel, p. ej. /github_issue_to_fix_workflow; si el texto final es un objeto JSON válido, se usa directamente como argumentos del prompt; cualquier otro texto se envía al LLM como mensaje de usuario adicional."
tui.help.mcp_prompt_form: "- Si se omite el texto final y el prompt define argumentos, se abre automáticamente un formulario de argumentos; el último campo del formulario admite una nota adicional."
tui.help.rules: "- /rule abre una lista desplazable de activación de reglas; Enter alterna la regla actual, Esc guarda y cierra, y la rueda del ratón recorre contenidos largos."
tui.help.skills: "- /skill abre una lista desplazable de activación de skills; Enter alterna la skill actual, Esc guarda y cierra, y la rueda del ratón recorre contenidos largos."
tui.help.extensions: "- /extension sin argumentos abre el panel de extensiones instaladas (Enter alterna el estado activado, Esc guarda). /extension list muestra las extensiones instaladas, /extension import <zip> importa un ZIP, /extension remove <id> elimina una extensión."
tui.help.skill_alias: "- Las skills habilitadas se exponen directamente como comandos slash de primer nivel, p. ej. /llm-debug; el texto final sirve como nota adicional de este turno y el cuerpo de la skill se inyecta como estado de system prompt independiente, sin fingir que el modelo lee archivos por sí mismo."
tui.help.mcp_server_optional: "- /mcp tools, /mcp resources y /mcp prompts pueden omitir el server cuando solo hay uno."
tui.help.log: "- /log abre por defecto el log actual de la CLI; /log export exporta una instantánea del log actual de la CLI; /log session export exporta la sesión LLM completa con el rastro de solicitudes."
tui.help.language: "- /language sin argumentos abre el menú de selección de idioma."
tui.help.approval: "- /approval sin argumentos abre el menú de selección de nivel de aprobación."
tui.help.networks: "- /network sin argumentos abre el menú de selección de versión HTTP del LLM."
tui.help.mouse: "- El ratón está activado por defecto: la rueda recorre el historial; al arrastrar una selección en la Conversation, Ctrl+Mayús+C o clic derecho para copiar borra la selección resaltada."
tui.help.ctrl_o: "- Ctrl+O muestra/oculta los detalles auxiliares: contenido de razonamiento, resúmenes de compactación y detalles de resultados de herramientas; los detalles auxiliares de las respuestas completadas también se conservan, y las herramientas fallidas o pendientes de confirmación permanecen expandidas."
