tui.mcp.usage: "Uso:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\nNotas:\n- `/mcp add` abre el formulario inferior, donde puede indicar la ubicación de guardado (usuario / espacio de trabajo `.spirit`) y un servidor STDIO o HTTP; Enter guarda, Esc cancela.\n- Los prompts MCP se exponen como comandos slash de primer nivel, p. ej. `/github_issue_to_fix_workflow`. Si el texto final es un objeto JSON válido, se usa directamente como argumentos del prompt; cualquier otro texto se envía al LLM como mensaje de usuario adicional.\n- Si se omite el texto y el prompt define argumentos, se abre automáticamente un formulario de argumentos; el último campo admite una nota adicional.\n- `/mcp tool call`, `/mcp resource attach` y `/mcp resource clear` se conservan como puntos de entrada de depuración, pero no son la vía principal de interacción."
