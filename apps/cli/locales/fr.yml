tui.mcp.usage: "Utilisation :\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\nRemarques :\n- `/mcp add` ouvre le formulaire en bas, permettant de renseigner l'emplacement d'enregistrement (utilisateur / espace de travail `.spirit`) et un serveur STDIO ou HTTP ; Entrée enregistre, Échap annule.\n- Les prompts MCP sont exposés comme commandes slash de premier niveau, par ex. `/github_issue_to_fix_workflow`. Si le texte final est un objet JSON valide, il est utilisé directement comme arguments du prompt ; tout autre texte est envoyé au LLM comme message utilisateur supplémentaire.\n- Si le texte est omis et que le prompt définit des arguments, un formulaire d'arguments s'ouvre automatiquement ; le dernier champ accepte une note supplémentaire.\n- `/mcp tool call`, `/mcp resource attach` et `/mcp resource clear` restent des points d'entrée de débogage, mais ne constituent pas le chemin d'interaction principal."
