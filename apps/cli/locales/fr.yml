tui.help.notes_header: "Remarques :"
tui.help.skill_usage: "- /<skill-name> [notes]"
tui.help.log_variants: "- /log (ou /log export, /log session export)"
tui.help.continue: "- /continue reprend la réponse de l'assistant précédemment interrompue explicitement."
tui.help.subagents: "- /subagents ouvre la liste des SubAgents de la session courante ; Entrée ouvre une vue en lecture seule de la sous-session, Échap revient à la session principale."
tui.help.image_pick: "- /image pick ouvre le sélecteur d'images du répertoire courant."
tui.help.image_queue: "- /image sans prompt ajoute l'image à la file d'envoi."
tui.help.file_reference: "- Taper @<nom_de_fichier> ouvre les suggestions de référence de fichiers du workspace ; Entrée réécrit le fichier sélectionné dans le champ de saisie au format @chemin suivi d'une espace."
tui.help.mcp_add: "- /mcp add ouvre le formulaire du bas pour renseigner le nom du serveur, l'emplacement d'enregistrement (utilisateur / workspace `.spirit`), le type, et la commande ou l'URL (Entrée pour enregistrer, Échap pour annuler)."
tui.help.hooks_add: "- /hooks add ouvre le formulaire du bas pour ajouter un Agent Hook (Entrée pour enregistrer, Échap pour annuler)."
tui.help.model_add: "- /model add ouvre le formulaire du bas : choisir le fournisseur et le mode d'ajout, renseigner le point de terminaison et la clé API ; après validation, il interroge le /models amont (les préréglages importent tous les id en lot, le mode personnalisé permet un ajout unitaire) ; variante en une ligne : /model add <name> <api_base> <api_key> ; en cas de succès, le modèle actif est changé."
tui.help.mcp_prompt_alias: "- Les prompts MCP sont exposés comme commandes slash de premier niveau, par ex. /github_issue_to_fix_workflow ; si le texte final est un objet JSON valide, il est utilisé directement comme arguments du prompt, sinon il est envoyé au LLM comme message utilisateur supplémentaire."
tui.help.mcp_prompt_form: "- Si le texte final est omis et que le prompt définit des arguments, un formulaire d'arguments s'ouvre automatiquement ; le dernier champ du formulaire accepte une note supplémentaire."
tui.help.rules: "- /rules ouvre une liste déroulante d'activation des règles ; Entrée bascule la règle courante, Échap enregistre et ferme, la molette permet de parcourir les contenus longs."
tui.help.skills: "- /skills ouvre une liste déroulante d'activation des compétences ; Entrée bascule la compétence courante, Échap enregistre et ferme, la molette permet de parcourir les contenus longs."
tui.help.extensions: "- /extensions sans argument ouvre le panneau des extensions installées. /extensions list affiche les extensions installées, /extensions import <zip> importe un ZIP, /extensions remove <id> supprime une extension ; la bascule activer/désactiver du panneau n'est pas encore implémentée."
tui.help.skill_alias: "- Les skills activées sont exposées directement comme commandes slash de premier niveau, par ex. /llm-debug ; le texte final sert de note supplémentaire pour ce tour, et le corps de la skill est injecté comme état de prompt système séparé, sans faire croire que le modèle lit lui-même des fichiers."
tui.help.mcp_server_optional: "- /mcp tools, /mcp resources et /mcp prompts peuvent omettre le serveur lorsqu'il n'y en a qu'un seul."
tui.help.log: "- /log ouvre par défaut le journal CLI courant ; /log export exporte un instantané du journal CLI courant ; /log session export exporte l'intégralité de la session LLM et la trace des requêtes."
tui.help.language: "- /language sans argument ouvre le menu de choix de la langue."
tui.help.approval: "- /approval sans argument ouvre le menu de choix du niveau d'approbation."
tui.help.networks: "- /networks sans argument ouvre le menu de choix de la version HTTP du LLM."
tui.help.mouse: "- La souris est activée par défaut : la molette parcourt l'historique ; glisser une sélection dans la Conversation, Ctrl+Maj+C ou clic droit pour copier efface la sélection en surbrillance."
tui.help.ctrl_o: "- Ctrl+O affiche/masque les détails auxiliaires : contenu de réflexion, résumés de compaction et détails des résultats d'outils ; les détails auxiliaires des réponses terminées sont conservés, les outils en échec ou en attente de confirmation restent dépliés."
tui.help.api_key_priority: "Priorité des sources de clé API : SPIRIT_API_KEY > trousseau propre au modèle > trousseau global."
