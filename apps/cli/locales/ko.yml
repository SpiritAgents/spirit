tui.mcp.usage: "사용법:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\n참고:\n- `/mcp add`는 하단 폼을 열며 저장 위치(사용자 / 워크스페이스 `.spirit`)와 STDIO 또는 HTTP server를 설정할 수 있습니다. Enter로 저장, Esc로 취소합니다.\n- MCP prompt는 1급 slash 명령으로 노출됩니다(예: `/github_issue_to_fix_workflow`). 끝부분이 유효한 JSON object이면 prompt 인자로 직접 사용되고, 다른 텍스트는 추가 사용자 메시지로 LLM에 전송됩니다.\n- 끝부분을 생략하고 prompt에 인자가 정의되어 있으면 인자 폼이 자동으로 열립니다. 폼 마지막 칸에 추가 설명을 입력할 수 있습니다.\n- `/mcp tool call`, `/mcp resource attach`, `/mcp resource clear`는 디버그 진입점으로 남아 있지만 주요 상호작용 경로는 아닙니다."
