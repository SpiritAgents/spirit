tui.help.mcp_prompt_alias: "- MCP prompt는 /github_issue_to_fix_workflow처럼 일급 slash 명령으로 노출됩니다. 끝부분이 유효한 JSON object이면 prompt 인수로 바로 사용되고, 그 외 텍스트는 추가 사용자 메시지로 LLM에 전송됩니다."
tui.help.mcp_prompt_form: "- 끝부분을 생략하고 prompt에 인수가 정의되어 있으면 인수 폼이 자동으로 열립니다. 폼의 마지막 칸에는 추가 설명을 입력할 수 있습니다."
tui.help.rules: "- /rule는 스크롤 가능한 규칙 활성화 목록을 엽니다. Enter로 현재 규칙을 전환하고 Esc로 저장 후 닫으며, 마우스 휠로 긴 내용을 탐색할 수 있습니다."
tui.help.skills: "- /skill는 스크롤 가능한 스킬 활성화 목록을 엽니다. Enter로 현재 스킬을 전환하고 Esc로 저장 후 닫으며, 마우스 휠로 긴 내용을 탐색할 수 있습니다."
tui.help.extensions: "- /extension를 인수 없이 실행하면 설치된 확장 패널을 엽니다(Enter로 활성화 상태 전환, Esc로 저장). /extension list는 설치된 확장을 출력하고, /extension import <zip>은 ZIP을 가져오며, /extension remove <id>는 확장을 삭제합니다."
tui.help.marketplace: "- /marketplace를 인수 없이 실행하면 로컬 내장 카탈로그를 엽니다(Enter로 설치 또는 제거, Esc로 닫기). /marketplace list는 카탈로그를 출력하고, /marketplace install <id>는 번들 내장 확장을 설치하며, /marketplace remove <id>는 제거합니다."
tui.help.skill_alias: "- 활성화된 skill은 /llm-debug처럼 일급 slash 명령으로 바로 노출됩니다. 끝부분 텍스트는 이번 턴의 추가 설명으로 사용되고, skill 본문은 별도의 system prompt 상태로 주입되며 모델이 스스로 파일을 읽는 것처럼 가장하지 않습니다."
tui.help.mcp_server_optional: "- /mcp tools, /mcp resources, /mcp prompts는 server가 하나뿐일 때 server를 생략할 수 있습니다."
tui.help.log: "- /log는 기본적으로 현재 CLI 로그를 엽니다. /log export는 현재 CLI 로그 스냅샷을 내보내고, /log session export는 LLM 세션 전문과 요청 추적을 내보냅니다."
tui.help.language: "- /language를 인수 없이 실행하면 언어 선택 메뉴를 엽니다."
tui.help.approval: "- /approval을 인수 없이 실행하면 승인 수준 선택 메뉴를 엽니다."
tui.help.networks: "- /network를 인수 없이 실행하면 LLM HTTP 버전 선택 메뉴를 엽니다."
tui.help.mouse: "- 마우스는 기본적으로 켜져 있습니다: 휠로 기록을 탐색하고, Conversation 내에서 드래그로 선택한 뒤 Ctrl+Shift+C 또는 우클릭으로 복사하면 반전 선택이 해제됩니다."
tui.help.ctrl_o: "- Ctrl+O는 보조 세부 정보의 표시/숨기기를 전환합니다: 사고 내용, 압축 요약, 도구 결과 세부 정보를 포함합니다. 완료된 응답의 보조 세부 정보도 유지되며, 실패 및 승인 대기 도구는 펼친 상태를 유지합니다."
tui.help.api_key_priority: "API Key 출처 우선순위: SPIRIT_API_KEY > 모델 전용 keyring > 전역 keyring."
tui.plan.start_implementing_only_plan: "이 명령어는 Plan 모드에서만 사용 가능합니다. Tab 키를 눌러 Plan 모드로 전환한 후 다시 시도하세요."
