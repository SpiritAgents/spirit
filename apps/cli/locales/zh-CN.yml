tui.tui.help: "- /tui 不带参数时打开 TUI 布局选择菜单。"
tui.loop.help: "- /loop 会切换当前会话的 Loop 状态；也支持 /loop on、/loop off 和 /loop status。"
tui.help.available_commands: "可用指令:"
tui.help.notes_header: "说明:"
tui.help.skill_usage: "- /<skill-name> [补充说明]"
tui.help.log_variants: "- /log（或 /log export、/log session export）"
tui.help.continue: "- /continue 会继续上一轮被显式中止的 assistant 回复。"
tui.help.subagents: "- /subagent 打开当前会话里的 SubAgent 列表；回车可进入只读子会话视图，Esc 返回主会话。"
tui.help.image_pick: "- /image pick 打开当前目录图片选择器。"
tui.help.image_queue: "- /image 不带 prompt 时会把图片加入待发送队列。"
tui.help.file_reference: "- 输入 @<文件名> 会打开工作区文件引用建议，回车后会把选中文件写回输入框，格式为 @路径 加一个空格。"
tui.help.mcp_add: "- /mcp add 打开底部表单，用于填写 server 名称、保存位置（用户 / 工作区 `.spirit`）、类型、命令或 URL（Enter 保存，Esc 取消）。"
tui.help.hooks_add: "- /hook add 打开底部表单，用于添加 Agent Hook（Enter 保存，Esc 取消）。"
tui.help.model_add: "- /model add 打开底部表单：选提供商与添加方式、填写端点与 API Key；提交后将请求上游 /models（预设为批量导入全部 id，自定义可选单条）；也可一行 /model add <name> <api_base> <api_key>；成功后会切换当前模型。"
tui.help.mcp_prompt_alias: "- MCP prompt 会以一级 slash 命令暴露，例如 /github_issue_to_fix_workflow；若尾部是合法 JSON object，会直接作为 prompt 参数，其他文本会作为附加用户消息发给 LLM。"
tui.help.mcp_prompt_form: "- 省略尾部且 prompt 定义了参数时，会自动打开参数表单；表单最后一栏可填写附加说明。"
tui.help.rules: "- /rule 打开可滚动的规则启用清单；Enter 切换当前规则，Esc 保存并关闭，鼠标滚轮可浏览长内容。"
tui.help.skills: "- /skill 打开可滚动的技能启用清单；Enter 切换当前技能，Esc 保存并关闭，鼠标滚轮可浏览长内容。"
tui.help.extensions: "- /extension 不带参数时会打开已安装扩展面板（Enter 切换启用状态，Esc 保存）。/extension list 会输出当前已安装扩展，/extension import <zip> 导入 ZIP，/extension remove <id> 删除扩展。"
tui.help.marketplace: "- /marketplace 不带参数时打开本地内置扩展目录（Enter 安装或卸载，Esc 关闭）。/marketplace list 列出目录，/marketplace install <id> 安装捆绑内置扩展，/marketplace remove <id> 卸载。"
tui.help.skill_alias: "- 已启用的 skill 会直接作为一级 slash 命令暴露，例如 /llm-debug；尾部文本会作为本轮附加说明，skill 正文会作为独立 system prompt 状态注入，不会伪装成模型自行读文件。"
tui.help.mcp_server_optional: "- /mcp tools、/mcp resources、/mcp prompts 在只有一个 server 时可省略 server。"
tui.help.log: "- /log 默认打开当前 CLI 日志；/log export 导出当前 CLI 日志快照；/log session export 导出 LLM 会话全文与请求轨迹。"
tui.help.language: "- /language 不带参数时打开语言选择菜单。"
tui.help.approval: "- /approval 不带参数时打开审批级别选择菜单。"
tui.help.networks: "- /network 不带参数时打开 LLM HTTP 版本选择菜单。"
tui.help.mouse: "- 鼠标默认开启：滚轮浏览历史；在 Conversation 内拖拽选区，Ctrl+Shift+C 或右键复制后会清除反色选区。"
tui.help.ctrl_o: "- Ctrl+O 切换辅助细节的显示/隐藏：包括思考内容、压缩摘要以及工具结果细节；已完成回复的辅助细节也会保留，失败与待确认工具保持展开。"
