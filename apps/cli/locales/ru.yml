tui.help.image_queue: "- /image без prompt добавляет изображение в очередь на отправку."
tui.help.file_reference: "- Ввод @<имя_файла> открывает подсказки ссылок на файлы рабочей области; Enter записывает выбранный файл обратно в поле ввода в формате @путь плюс пробел."
tui.help.mcp_add: "- /mcp add открывает нижнюю форму для ввода имени сервера, места сохранения (пользователь / рабочая область `.spirit`), типа, команды или URL (Enter — сохранить, Esc — отмена)."
tui.help.hooks_add: "- /hook add открывает нижнюю форму для добавления Agent Hook (Enter — сохранить, Esc — отмена)."
tui.help.model_add: "- /model add открывает нижнюю форму: выберите провайдера и способ добавления, укажите endpoint и API Key; после отправки запрашивается upstream /models (пресеты импортируют все id пакетно, для custom можно одну запись); также одной строкой: /model add <name> <api_base> <api_key>; при успехе активная модель переключается."
tui.help.mcp_prompt_alias: "- MCP prompt'ы раскрываются как slash-команды первого уровня, например /github_issue_to_fix_workflow; если хвост — валидный JSON-объект, он напрямую используется как аргументы prompt, остальной текст отправляется LLM как дополнительное сообщение пользователя."
tui.help.mcp_prompt_form: "- Если хвост опущен и prompt определяет аргументы, автоматически открывается форма аргументов; последнее поле формы принимает дополнительное примечание."
tui.help.rules: "- /rule открывает прокручиваемый список включения правил; Enter переключает текущее правило, Esc сохраняет и закрывает, колесо мыши прокручивает длинное содержимое."
tui.help.skills: "- /skill открывает прокручиваемый список включения навыков; Enter переключает текущий навык, Esc сохраняет и закрывает, колесо мыши прокручивает длинное содержимое."
tui.help.extensions: "- /extension без аргументов открывает панель установленных расширений (Enter переключает состояние, Esc сохраняет). /extension list выводит установленные расширения, /extension import <zip> импортирует ZIP, /extension remove <id> удаляет расширение."
tui.help.skill_alias: "- Включённые skill'ы раскрываются напрямую как slash-команды первого уровня, например /llm-debug; хвостовой текст служит дополнительным примечанием этого хода, а тело skill внедряется как отдельное состояние system prompt, не выдавая это за самостоятельное чтение файлов моделью."
tui.help.mcp_server_optional: "- /mcp tools, /mcp resources и /mcp prompts позволяют опустить server, если он только один."
tui.help.log: "- /log по умолчанию открывает текущий лог CLI; /log export экспортирует снимок текущего лога CLI; /log session export экспортирует полный текст сессии LLM с трассировкой запросов."
tui.help.language: "- /language без аргументов открывает меню выбора языка."
tui.help.approval: "- /approval без аргументов открывает меню выбора уровня одобрения."
tui.help.networks: "- /network без аргументов открывает меню выбора версии HTTP для LLM."
tui.help.mouse: "- Мышь включена по умолчанию: колесо прокручивает историю; при выделении перетаскиванием в Conversation Ctrl+Shift+C или копирование правой кнопкой снимает инвертированное выделение."
tui.help.ctrl_o: "- Ctrl+O переключает показ вспомогательных деталей: содержимое размышлений, сводки компактификации и детали результатов инструментов; вспомогательные детали завершённых ответов также сохраняются, а ошибочные и ожидающие подтверждения инструменты остаются развёрнутыми."
