tui.help.continue: "- /continue продолжает предыдущий ответ ассистента, который был явно прерван."
tui.help.subagents: "- /subagent открывает список SubAgent текущей сессии; Enter открывает просмотр подсессии только для чтения, Esc возвращает в основную сессию."
