tui.mcp.usage: "Использование:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\nПримечания:\n- `/mcp add` открывает нижнюю форму, где можно указать место сохранения (пользователь / рабочая область `.spirit`) и STDIO- или HTTP-сервер; Enter — сохранить, Esc — отмена.\n- Промпты MCP доступны как slash-команды первого уровня, например `/github_issue_to_fix_workflow`. Если завершающий текст — корректный JSON-объект, он используется напрямую как аргументы промпта; любой другой текст отправляется LLM как дополнительное сообщение пользователя.\n- Если текст опущен и промпт определяет аргументы, форма аргументов открывается автоматически; последнее поле принимает дополнительную заметку.\n- `/mcp tool call`, `/mcp resource attach` и `/mcp resource clear` остаются отладочными точками входа, но не являются основным путём взаимодействия."
