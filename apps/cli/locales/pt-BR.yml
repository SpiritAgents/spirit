tui.mcp.usage: "Uso:\n- /mcp\n- /mcp list\n- /mcp add\n- /mcp inspect [server]\n- /mcp tools [server]\n- /mcp resources [server]\n- /mcp prompts [server]\n- /<server>_<prompt> [args_json | user_message]\n\nNotas:\n- `/mcp add` abre o formulário inferior, permitindo definir o local de salvamento (usuário / workspace `.spirit`) e um servidor STDIO ou HTTP; Enter salva, Esc cancela.\n- Prompts MCP são expostos como comandos slash de primeiro nível, ex. `/github_issue_to_fix_workflow`. Se o texto final for um objeto JSON válido, ele é usado diretamente como argumentos do prompt; qualquer outro texto é enviado ao LLM como mensagem adicional do usuário.\n- Se o texto for omitido e o prompt definir argumentos, um formulário de argumentos abre automaticamente; o último campo aceita uma nota adicional.\n- `/mcp tool call`, `/mcp resource attach` e `/mcp resource clear` permanecem como pontos de entrada de depuração, mas não são o caminho principal de interação."
