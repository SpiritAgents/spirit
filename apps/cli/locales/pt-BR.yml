tui.help.mcp_add: "- /mcp add abre o formulário inferior para preencher o nome do server, o local de salvamento (usuário / workspace `.spirit`), o tipo e o comando ou URL (Enter salva, Esc cancela)."
tui.help.hooks_add: "- /hook add abre o formulário inferior para adicionar um Agent Hook (Enter salva, Esc cancela)."
tui.help.model_add: "- /model add abre o formulário inferior: escolha o provedor e o modo de adição, preencha o endpoint e a API Key; após enviar, ele requisita o /models upstream (presets importam todos os ids em lote, personalizado permite uma única entrada); também é possível em uma linha: /model add <name> <api_base> <api_key>; em caso de sucesso, o modelo ativo é trocado."
tui.help.mcp_prompt_alias: "- Prompts MCP são expostos como comandos slash de primeiro nível, ex. /github_issue_to_fix_workflow; se o texto final for um objeto JSON válido, ele é usado diretamente como argumentos do prompt; outros textos são enviados ao LLM como mensagem de usuário adicional."
tui.help.mcp_prompt_form: "- Se o texto final for omitido e o prompt definir argumentos, um formulário de argumentos abre automaticamente; o último campo do formulário aceita uma nota adicional."
tui.help.rules: "- /rule abre uma lista rolável de ativação de regras; Enter alterna a regra atual, Esc salva e fecha, e a roda do mouse percorre conteúdos longos."
tui.help.skills: "- /skill abre uma lista rolável de ativação de skills; Enter alterna a skill atual, Esc salva e fecha, e a roda do mouse percorre conteúdos longos."
tui.help.extensions: "- /extension sem argumentos abre o painel de extensões instaladas (Enter alterna o estado ativado, Esc salva). /extension list exibe as extensões instaladas, /extension import <zip> importa um ZIP, /extension remove <id> remove uma extensão."
tui.help.skill_alias: "- Skills habilitadas são expostas diretamente como comandos slash de primeiro nível, ex. /llm-debug; o texto final serve como nota adicional deste turno e o corpo da skill é injetado como estado de system prompt separado, sem fingir que o modelo lê arquivos por conta própria."
tui.help.mcp_server_optional: "- /mcp tools, /mcp resources e /mcp prompts podem omitir o server quando há apenas um."
tui.help.log: "- /log abre por padrão o log atual da CLI; /log export exporta um snapshot do log atual da CLI; /log session export exporta a sessão LLM completa com o rastro de requisições."
tui.help.language: "- /language sem argumentos abre o menu de seleção de idioma."
tui.help.approval: "- /approval sem argumentos abre o menu de seleção de nível de aprovação."
tui.help.networks: "- /network sem argumentos abre o menu de seleção de versão HTTP do LLM."
tui.help.mouse: "- O mouse vem ativado por padrão: a roda percorre o histórico; ao arrastar uma seleção na Conversation, Ctrl+Shift+C ou clique direito para copiar limpa a seleção destacada."
tui.help.ctrl_o: "- Ctrl+O alterna a exibição de detalhes auxiliares: conteúdo de pensamento, resumos de compactação e detalhes de resultados de ferramentas; detalhes auxiliares de respostas concluídas também são mantidos, e ferramentas com falha ou pendentes de confirmação permanecem expandidas."
