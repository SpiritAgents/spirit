appId: dev.spirit.desktop
productName: Spirit
icon: build/icon.ico
artifactName: Spirit-Desktop-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
beforeBuild: scripts/electron-builder-before-build.mjs
files:
  - package.json
  - dist/**/*
  - dist-electron/**/*
  - build/tray/**/*
  - "!**/target/**/*"
  - from: ../.desktop-pack-node-modules/node_modules
    to: node_modules
  - from: ../.desktop-pack-node-modules/node_modules/@vscode
    to: node_modules/@vscode
    filter:
      - ripgrep/**
      - ripgrep-*/**
  - ../../packages/agent-core/dist/**/*
  - ../../packages/agent-core/package.json
  - ../../packages/host-internal/dist/**/*
  - ../../packages/host-internal/package.json
  - ../../packages/server/dist/**/*
  - ../../packages/server/package.json
extraMetadata:
  main: dist-electron/electron/main.js
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/koffi/**/*
  - node_modules/@napi-rs/keyring/**/*
  - dist-electron/native/**/*
  - node_modules/@vscode/ripgrep/**/*
  - node_modules/@vscode/ripgrep-*/**/*
npmRebuild: true
buildDependenciesFromSource: false
publish: null
win:
  executableName: Spirit
  target:
    - nsis
    - zip
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  # Prefer darwin over electron-builder's default ${os}=mac for release URL alignment.
  artifactName: Spirit-Desktop-${version}-darwin-${arch}.${ext}
  icon: build/icon.png
  # Info.plist LSApplicationCategoryType; mapped to "效率与财务" (Productivity & Finance) in the Apps app (Tahoe+).
  # Do not rely on Electron's default developer-tools category (the new Apps app no longer has it).
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Helper processes need the same JIT entitlements as the main app; one plist covers both.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs as its own CI job against the finished dmg/zip: bundling it here ties a
  # 35-minute Apple round trip to the build, so one network blip discards the signed output too.
  notarize: false
dmg:
  # background.png / background@2x.png under build/ are picked up automatically by dmg-builder; the window size follows the image (540x408).
  # Note: the DMG window height includes the Finder title bar (~28pt), so the content area is only 380pt and the bottom 28pt of the background image is clipped.
  # The background image therefore deliberately keeps a 28px white band at the bottom, so the arrow baked into the background and the icon below (y=190) land at the visual center of the content area;
  # keep this bottom padding when revising the design, otherwise the layout will look shifted downward.
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications
linux:
  executableName: spirit-desktop
  maintainer: Spirit contributors <121384036+N123999@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: Development
