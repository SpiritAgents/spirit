<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spirit</title>
    <script>
      (function () {
        if (!window.spiritDesktop) return;
        var root = document.documentElement;
        root.classList.add("spirit-desktop-native", "spirit-launch-splash-active");
        var translucency = true;
        try {
          if (window.spiritDesktop && window.spiritDesktop.readTranslucency() === false) {
            translucency = false;
          }
        } catch (_err) {}
        if (translucency) root.classList.add("spirit-desktop-translucency");
        var themeRaw = null;
        try {
          themeRaw = localStorage.getItem("spirit-desktop-theme");
        } catch (_err2) {}
        var pref =
          themeRaw === "dark" || themeRaw === "light" || themeRaw === "system"
            ? themeRaw
            : "system";
        var osDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          if (window.spiritDesktop) {
            osDark = window.spiritDesktop.readOsPrefersDark();
          }
        } catch (_err3) {}
        var storedDark = pref === "dark" || (pref === "system" && osDark);
        if (storedDark) {
          root.classList.add("dark");
          root.dataset.spiritTheme = "dark";
        } else {
          root.dataset.spiritTheme = "light";
        }
      })();
    </script>
    <style>
      html.spirit-desktop-native.spirit-desktop-translucency,
      html.spirit-desktop-native.spirit-desktop-translucency body {
        background: transparent !important;
      }
      /* First-frame critical background when Blur is off: matches electronRootBackgroundForBackdrop / styles.css Void, must load before module CSS */
      html.spirit-desktop-native:not(.spirit-desktop-translucency),
      html.spirit-desktop-native:not(.spirit-desktop-translucency) body {
        background-color: #fafafa;
      }
      html.spirit-desktop-native:not(.spirit-desktop-translucency).dark,
      html.spirit-desktop-native:not(.spirit-desktop-translucency).dark body {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
