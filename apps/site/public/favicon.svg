<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Generated by scripts/generate-brand-assets.mjs. Web-only rounding; the packaging source stays square. -->
  <defs>
    <clipPath id="site-icon-corners">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#site-icon-corners)">
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Light-surface brand master. Keep the canvas, glyph transform, and layer geometry identical to logo-dark.svg.
    Glyph path is duplicated from packages/brand/src/constants.js; update together.
    Black-alpha glass and tinted edges follow the site's light CTA palette. Fill 0.26/0.08 and a crisp
    0.72-opacity, 0.75-width outline replace the CTA's 0.06/0.018 fill and 0.27-opacity, 0.5-width outline
    so the shape stays legible at favicon and title-bar sizes. Consumers own rounded masks, not this source.
  -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="logo-light-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F1932" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="logo-light-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.045"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0F1E3C" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="logo-light-fresnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#466EBE" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#C86E6E" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#6EBE8C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8C6EC8" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="logo-light-blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="logo-light-blur-md" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g transform="translate(135.230,107.344) scale(2.08)">
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="url(#logo-light-fill)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="url(#logo-light-inner)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="url(#logo-light-fresnel)" stroke-width="3" opacity="0.25" filter="url(#logo-light-blur-md)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="#000000" stroke-opacity="0.72" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5" filter="url(#logo-light-blur-sm)" opacity="0.5"/>
  </g>
</svg>
  </g>
</svg>
